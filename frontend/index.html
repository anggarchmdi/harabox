<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
    <title>Pawon Hara | Katering & Nasi Box Istimewa</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pawon_hara_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            root.style.backgroundColor = '#1C0B09';
          } else {
            root.style.backgroundColor = '#FBF7F2';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FBF7F2] text-[#2B120E] font-sans antialiased selection:bg-[#F59E0B] selection:text-[#2B120E]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
